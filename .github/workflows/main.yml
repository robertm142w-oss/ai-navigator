name: Build Android Debug APK


on:
  workflow_dispatch:


jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create www directory and copy index.html
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Initialize npm and install Capacitor packages
        run: |
          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0

      - name: Initialize Capacitor project
        run: npx cap init "AI Navigator" com.example.ainavigator

      - name: Create capacitor.config.json
        run: echo '{"appId":"com.example.ainavigator","appName":"AI Navigator","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json

      - name: Add Android platform via Cap
        run: npx cap add android

      - name: Sync Capacitor to android
        run: npx cap sync android

      - name: Configure Android permissions
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          for perm in ['ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION']:
              key = '{http://schemas.android.com/apk/res/android}name'
              value = 'android.permission.' + perm
              if not any(p.get(key) == value for p in root.findall('uses-permission')):
                  ET.SubElement(root, 'uses-permission', {key: value})
          tree.write(manifest_path, encoding='UTF-8', xml_declaration=True)
          "

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVIGATOR_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NAVIGATOR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NAVIGATOR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NAVIGATOR_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.NAVIGATOR_CERT_SHA256 }}
        run: |
          set -eu
          : "${KEYSTORE_B64:?Missing permanent keystore secret}"
          : "${STORE_PASSWORD:?Missing store password}"
          : "${KEY_ALIAS:?Missing key alias}"
          : "${KEY_PASSWORD:?Missing key password}"
          : "${EXPECTED_CERT:?Missing approved certificate fingerprint}"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/navigator.p12"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign with permanent key
        env:
          STORE_PASSWORD: ${{ secrets.NAVIGATOR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NAVIGATOR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NAVIGATOR_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.NAVIGATOR_CERT_SHA256 }}
        run: |
          set -eu
          signer="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          "$signer" sign --ks "$RUNNER_TEMP/navigator.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$RUNNER_TEMP/signed.apk" "$apk"
          actual=$("$signer" verify --print-certs "$RUNNER_TEMP/signed.apk" | awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}')
          test "$(printf '%s' "$actual" | tr 'A-F' 'a-f')" = "$(printf '%s' "$EXPECTED_CERT" | tr -d ':' | tr 'A-F' 'a-f')"
          mv "$RUNNER_TEMP/signed.apk" "$apk"

      - name: Verify packaged AI interface
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk = Path('android/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              html = z.read('assets/public/index.html')
          assert html == Path('index.html').read_bytes(), 'Packaged source mismatch'
          for marker in [b'id="aiPrompt"', b'id="aiStatus"', b'<title>']:
              assert marker in html, marker
          PY
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          retention-days: 7
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build Android Debug APK


on:
  workflow_dispatch:
  push:


jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create www directory and copy index.html
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Initialize npm and install Capacitor packages
        run: |
          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0

      - name: Initialize Capacitor project
        run: npx cap init "AI Navigator" com.example.ainavigator

      - name: Create capacitor.config.json
        run: echo '{"appId":"com.example.ainavigator","appName":"AI Navigator","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json

      - name: Add Android platform via Cap
        run: npx cap add android

      - name: Sync Capacitor to android
        run: npx cap sync android

      - name: Configure Android permissions
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          for perm in ['ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION']:
              child = ET.SubElement(root, 'uses-permission')
              child.set('android:name', 'android.permission.' + perm)
          tree.write(manifest_path, encoding='UTF-8', xml_declaration=True)
          "

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

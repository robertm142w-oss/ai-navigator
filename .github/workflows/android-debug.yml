name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [ai-readiness]
    paths:
      - .github/workflows/android-debug.yml
      - index.html
      - android-overlay/**
      - scripts/prepare-android.py
      - scripts/prepare-web.cjs
      - tests/**
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node --test tests/*.cjs
      - run: node scripts/prepare-web.cjs
      - run: |
          npm init -y
          npm install --save-exact @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3
          npx cap init "The Word" com.example.theword.preview --web-dir www
          npx cap add android
          npx cap sync android
          python3 scripts/prepare-android.py com.example.theword.preview
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify Android package
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$build_tools/apksigner" verify --print-certs "$apk"
          "$build_tools/aapt" dump badging "$apk" | grep -F "package: name='com.example.theword.preview'"
          "$build_tools/aapt" dump badging "$apk" | grep -F "application-label:'The Word'"
          unzip -p "$apk" assets/public/index.html | cmp - www/index.html
          python3 - "$apk" <<'PY'
          from sys import argv
          from zipfile import ZipFile
          with ZipFile(argv[1]) as archive:
              dex_files = [
                  archive.read(name)
                  for name in archive.namelist()
                  if name.endswith(".dex")
              ]
              for plugin in (
                  b"Lcom/example/ainavigator/device/WordDevicePlugin;",
                  b"Lcom/example/ainavigator/voice/WordVoicePlugin;",
                  b"Lcom/example/ainavigator/share/WordSharePlugin;",
              ):
                  assert any(plugin in dex for dex in dex_files), f"Missing {plugin}"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: the-word-test-apk
          retention-days: 7
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: AI smoke tests
on:
  push:
    paths:
      - index.html
      - tests/**
      - .github/workflows/ai-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node tests/ai-smoke.cjs
